[versions]
mod = "0.1.0-SNAPSHOT"

java = "25"
minecraft = "26.1.2"

kotlin = "2.4.20"
coroutines = "1.11.0"
serialization = "1.11.0"

architectury-api = "20.1.16"

fabric-loader = "0.19.5"
fabric-api = "0.155.3+26.1.2"
fabric-language-kotlin = "1.14.1+kotlin.2.4.20"

neoforge = "26.1.2.112"

junit = "6.1.3"
jspecify = "1.0.1"
sponge-mixin = "0.17.4+mixin.0.8.7"

[libraries]
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }

architectury-common = { module = "dev.architectury:architectury", version.ref = "architectury-api" }
architectury-fabric = { module = "dev.architectury:architectury-fabric", version.ref = "architectury-api" }
architectury-neoforge = { module = "dev.architectury:architectury-neoforge", version.ref = "architectury-api" }

kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-core-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm", version.ref = "serialization" }
kotlinx-serialization-json-jvm = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm", version.ref = "serialization" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
sponge-mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "sponge-mixin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# Build-tool plugin versions are intentionally NOT here: Gradle's settings `plugins {}` block cannot
# read the version catalog, so stonecutter/kotlin/architectury plugin versions live in
# gradle.properties. See the comment there.
