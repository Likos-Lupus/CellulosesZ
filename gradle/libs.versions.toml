[versions]
minecraft = "26.1.2"
java = "25"

fabric-loader = "0.19.3"
fabric-api = "0.154.0+26.1.2"
fabric-language-kotlin = "1.13.13+kotlin.2.4.10"
loom = "1.17-SNAPSHOT"
architectury-api = "20.0.12"
architectury-plugin = "3.5.169"
shadow = "9.6.1"

kotlin = "2.4.10"
coroutines = "1.11.0"
jackson = "3.2.2"
jspecify = "1.0.1"
junit = "6.1.3"
adventure = "5.2.0"
luckperms = "5.5"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
architectury-common = { module = "dev.architectury:architectury", version.ref = "architectury-api" }
architectury-fabric = { module = "dev.architectury:architectury-fabric", version.ref = "architectury-api" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jackson-kotlin = { module = "tools.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
architectury-plugin = { id = "architectury-plugin", version.ref = "architectury-plugin" }
architectury-loom-no-remap = { id = "dev.architectury.loom-no-remap", version.ref = "loom" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
