[versions]
minecraft = "26.1.2"
java = "25"

fabric-loader = "0.19.3"
fabric-api = "0.154.0+26.1.2"
loom = "1.17-SNAPSHOT"
architectury-api = "21.0.6"
architectury-plugin = "3.5.169"
shadow = "9.6.1"
spotless = "8.9.0"
palantir-java-format = "2.96.0"

jackson = "3.2.1"
jspecify = "1.0.1"
lombok = "1.18.46"
classgraph = "4.8.180"
junit = "6.1.2"
adventure = "5.2.0"
luckperms = "5.5"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
architectury-common = { module = "dev.architectury:architectury", version.ref = "architectury-api" }
architectury-fabric = { module = "dev.architectury:architectury-fabric", version.ref = "architectury-api" }

jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-yaml = { module = "tools.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }

[plugins]
architectury-plugin = { id = "architectury-plugin", version.ref = "architectury-plugin" }
architectury-loom-no-remap = { id = "dev.architectury.loom-no-remap", version.ref = "loom" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
