# CellulosesZ configuration (TOML).
#
# This file is a packaged template. It is written once, on first start, and is never
# rewritten by the mod; edit it freely. Unknown keys are rejected, so a typo fails the load.

[diagnostics]
# When true, storage/permission/health diagnostics are logged more verbosely. Secrets are never logged.
verboseLogging = false

# ---------------------------------------------------------------------------
# Storage. Only the backend named by `type` is initialized. Every backend has its
# own section, so you can prepare an alternative backend and switch `type` later;
# switching the active backend migrates data on the next cold start.
# ---------------------------------------------------------------------------
[database]
# One of: sqlite, h2, mysql, mariadb, postgresql.
type = "sqlite"
# Logical namespace stored alongside all rows. Use distinct values to share one
# database/schema between several servers. Must match [a-z0-9_]{1,32}.
namespace = "default"

# Shared pool timeouts; backend sections may override selected values.
[database.pool]
maximum-pool-size = 10
connection-timeout-ms = 10000
validation-timeout-ms = 5000
idle-timeout-ms = 600000
max-lifetime-ms = 1800000
keepalive-time-ms = 0

[database.sqlite]
# Relative paths resolve under <world>/cellulosesz/.
path = "cellulosesz.db"
busy-timeout-ms = 5000
journal-mode = "wal"
synchronous = "normal"
foreign-keys = true

[database.sqlite.pool]
# A single writer connection is the safe SQLite default.
maximum-pool-size = 1

[database.h2]
path = "cellulosesz"
username = "sa"
# Set at most one of password / password-env.
password = ""
password-env = ""

[database.h2.pool]
maximum-pool-size = 2

[database.mysql]
host = "127.0.0.1"
port = 3306
database = "cellulosesz"
username = "cellulosesz"
# Set at most one of password / password-env. Prefer password-env so the secret is not on disk.
password = ""
password-env = ""
ssl-mode = "preferred"

[database.mysql.pool]
maximum-pool-size = 10

[database.mariadb]
host = "127.0.0.1"
port = 3306
database = "cellulosesz"
username = "cellulosesz"
password = ""
password-env = ""
ssl-mode = "preferred"

[database.mariadb.pool]
maximum-pool-size = 10

[database.postgresql]
host = "127.0.0.1"
port = 5432
database = "cellulosesz"
schema = "public"
username = "cellulosesz"
password = ""
password-env = ""
ssl-mode = "prefer"

[database.postgresql.pool]
maximum-pool-size = 10

# ---------------------------------------------------------------------------
# Localization and text. CellulosesZ renders its own messages server-side; this
# controls CellulosesZ-owned text only, not the player's Minecraft client language.
# ---------------------------------------------------------------------------
[localization]
# Default language for players without an explicit /cellulosesz language preference.
# Must be one of the bundled languages (en_us, zh_cn).
defaultLanguage = "en_us"

[text]
# Preset palette: default | high-contrast | minimal.
theme = "default"
# Layout density: comfortable | compact.
density = "comfortable"

# Optional colour overrides. Uncomment and edit individual tokens; the selected preset supplies any
# token you leave commented.
# [text.colors]
# body = "#E8EDF4"
# secondary = "#B8C4D2"
# muted = "#8D9DB1"
# brand = "#78AFFF"
# heading = "#F5C86B"
# value = "#F8DB98"
# action = "#85C9FF"
# success = "#86D7A0"
# warning = "#FFCF79"
# error = "#FF858B"
# code = "#C4B3F5"
# divider = "#71819A"

# ---------------------------------------------------------------------------
# Commands. These are registration-time bindings: changing any value needs a
# restart. The namespaced form /cellulosesz:<command> is always available even
# when the short names below are disabled or a short name was taken by another mod.
# ---------------------------------------------------------------------------
[commands]
# Register the short canonical command names (for example /home). When a short name
# is already owned by another mod, CellulosesZ skips it and keeps the namespaced form.
shortNamesEnabled = true
# Register the short aliases (for example /r). Same conflict rule as above. Protected `cz`
# fallbacks such as /czme are NOT gated by this switch.
aliasesEnabled = true
# Enhance vanilla `/help <command>` for CellulosesZ commands only. Plain `/help` and
# every non-CellulosesZ query stay vanilla. Set false to leave `/help` entirely untouched.
vanillaHelpOverlayEnabled = true
# Persist command cooldowns across restarts.
cooldownPersistence = true
# Canonical CellulosesZ command names that must not be registered. Requires a restart.
disabled = []

# Exact per-command cost, charged through the economy ledger. Requires [economy] enabled = true.
# Example: "home" = "5.00"
[commands.costs]

# Per-command cooldowns in seconds; "*" is the default for every command.
# Example: "*" = 0, "home" = 5
[commands.cooldowns]

# Take over vanilla command literals. Disabled by default: vanilla keeps /me, /tp, ... and
# CellulosesZ uses the protected /cz* and /cellulosesz:* entries. When enabled, only commands
# listed below and verified for this version are taken over; unsupported names are rejected at
# startup. Requires a restart.
[commands.vanillaOverrides]
enabled = false
commands = []

# ---------------------------------------------------------------------------
# Movement
# ---------------------------------------------------------------------------
[movement.teleport]
delaySeconds = 0
cooldownSeconds = 0
cancelOnMove = true
cancelOnDamage = true
movementTolerance = 0.15
dismountPassengers = true
# Damage immunity granted after a committed teleport. 0 disables it.
invulnerabilitySeconds = 0

[movement.teleport.safety]
enabled = true
searchHorizontalRadius = 3
searchVerticalRadius = 8
allowWater = false

[movement.requests]
timeoutSeconds = 60
maxIncomingPerPlayer = 5
maxOutgoingPerPlayer = 16
maxRequestsServerWide = 4096
maxBatchRecipients = 16
batchCooldownSeconds = 120
maxAutoAllowedPlayers = 128
# Whether a player accepts incoming teleport requests until they change it with /tptoggle.
acceptByDefault = true

[movement.homes]
maxPerPlayer = 10
defaultName = "home"
# Per-group home limits: the highest matching entry wins, and maxPerPlayer is the fallback when none
# matches. Example: [[movement.homes.limits]] permission = "cellulosesz.homes.20" ; max = 20
limits = []
# When true, using a home in another world also needs cellulosesz.world.home.<dimension>.
worldHomePermissions = false
# Ask for a second confirmation before /sethome overwrites an existing home.
confirmHomeOverwrite = true

# World switching (/world). Aliases map a short name to a dimension id.
[movement.worlds.aliases]
overworld = "minecraft:overworld"
nether = "minecraft:the_nether"
end = "minecraft:the_end"

# Cross-world teleport permission gate. When true, a teleport that changes dimension needs
# cellulosesz.world.<dimension> for the moved player.
[movement.worldAccess]
enabled = false

[movement.warps]
# When true, each warp needs cellulosesz.warp.<name>, and /warps only lists usable warps.
perWarpPermission = false

[movement.history]
enabled = true

[movement.randomTeleport]
enabled = true
maxAttempts = 16
maxRadius = 10000
maxRegions = 32
searchTimeoutSeconds = 20
cooldownSeconds = 120
maxConcurrentServerSearches = 2
maxConcurrentPerPlayer = 1
allowChunkGeneration = false
allowWater = false

[movement.terrain]
enabled = true
maxJumpDistance = 32
requireLoadedChunks = true
allowWater = false

# ---------------------------------------------------------------------------
# Communication
# ---------------------------------------------------------------------------
[messaging]
enabled = true

[messaging.privateMessages]
enabled = true
maxMessageLength = 512
maxIgnoredPlayers = 128
defaultReplyMode = "LAST_INTERACTION"
# Whether /reply reuses the last conversation partner until a player changes it with /rtoggle.
defaultReplyRecipient = true

[messaging.mail]
enabled = true
maxMessageLength = 1000
maxMessagesPerMailbox = 100
maxSendsPerMinute = 10
notifyOnJoin = true

[messaging.helpOp]
enabled = true
maxMessageLength = 512
maxMessagesPerMinute = 6

[messaging.announcements]
enabled = true
maxMessageLength = 1000

# Server info pages: /motd, /rules, /info and /customtext <page>. Markdown files live under
# <config-dir>/cellulosesz/<rootDirectory>/<lang>/<page>.md (en_us is the fallback language).
[messaging.serverPages]
enabled = true
rootDirectory = "pages"
maxPageBytes = 65536
maxPages = 128
showMotdOnJoin = false

# /me action messages. `audience` is `same_dimension` or `server`.
# /czme and /cellulosesz:me are always available as protected fallbacks. To let CellulosesZ take
# over the vanilla /me literal, enable the override in [commands.vanillaOverrides] below.
[messaging.actionMessage]
enabled = true
audience = "same_dimension"
maximumLength = 256
messagesPerMinute = 8

# Join/quit announcements. Templates are strict MiniMessage; a malformed template is rejected at
# load/reload. Supported tokens: {PLAYER} {USERNAME} {DISPLAYNAME} {PREVIOUS_NAME} {WORLD}
# {ONLINE} {UNIQUE} {UPTIME} {GROUP}. {PREFIX}/{SUFFIX} are intentionally unsupported.
[messaging.joinQuit]
enabled = true
joinFormat = "<yellow>{PLAYER} joined the game</yellow>"
quitFormat = "<yellow>{PLAYER} left the game</yellow>"
firstJoinFormat = "<gold>{PLAYER} joined for the first time</gold>"
newUsernameFormat = "<gray>{PLAYER} (previously {PREVIOUS_NAME}) joined the game</gray>"
# A player with cellulosesz.silentjoin joins/quits without an announcement; with
# cellulosesz.silentjoin.vanish they also enter vanish.
allowSilentJoinQuit = true
# Suppress every join/quit announcement above this online count. 0 disables.
hideAbovePlayerCount = 0

# Death messages. A customFormat replaces the vanilla message; when absent the vanilla message is
# left untouched. showCoordinates sends the death position to the dead player.
[messaging.death]
enabled = true
# customFormat = "<red>{PLAYER} died</red>"
showCoordinates = true
coordinatesFormat = "<gray>You died at <white>{X}, {Y}, {Z}</white> in {WORLD}</gray>"

# ---------------------------------------------------------------------------
# Administration
# ---------------------------------------------------------------------------
[administration.moderation]
enabled = true
protectOperators = true
defaultKickReason = "Kicked by an administrator"
defaultBanReason = "Banned by an administrator"
defaultMuteReason = "Muted by an administrator"
maxReasonLength = 256
notifyModerators = true
auditEnabled = true
# Command roots a muted player may not run. Matched on the canonical CellulosesZ command name;
# "*" blocks every command. Empty disables the gate.
mutedCommands = ["msg", "reply", "mail", "me", "helpop"]
# Login PvP protection window, in seconds (0 disables). Bypassed by cellulosesz.pvpdelay.exempt.
loginAttackDelaySeconds = 5
# Optional cap for a single /mute duration; cellulosesz.mute.unlimited bypasses it. Omit for no cap.
# maxMuteSeconds = 3600

[administration.jail]
enabled = true
defaultJail = ""
maxJails = 32
allowedRadius = 8.0
returnOnRelease = true
confinementCheckIntervalTicks = 20
restrictCommands = false
# Commands a confined player may still run when restrictCommands is true. Matched on the first token
# (leading slash and case ignored); the namespaced form cellulosesz:<entry> is accepted automatically.
allowedCommands = ["helpop"]
# Count only online time for timed sentences (uses cz_jail_sentences.remaining_seconds).
jailOnlineTime = false

[administration.playerAdjustments]
# Upper bound for a single /exp give|take|set amount; larger values are clamped.
maximumExperienceAdjustment = 1000000
# Allowed /speed multiplier range (walk and fly). Values outside are clamped.
minimumSpeedMultiplier = 0.1
maximumSpeedMultiplier = 3.0
# Seconds between /heal uses; 0 disables. Bypassed by cellulosesz.heal.cooldown.bypass.
healCooldownSeconds = 0
# Remove all mob effects from the healed player.
removeEffectsOnHeal = false
# Dimension ids where /god is refused and stripped on entry.
noGodWorlds = []
removeGodOnDisconnect = true
flyOnJoin = false
resetFlyOnWorldChange = false
preserveFlyOnGamemodeChange = true

[administration.entityTools]
maxSpawnAmount = 64
maxRemoveRadius = 128.0

[administration.worldTools]
maxNukeRadius = 16.0
maxFireworkPower = 4
maxFireworkAmount = 8
maxBurnSeconds = 60.0

[administration.fun]
enabled = true

[administration.signEditing]
enabled = true
maxLineLength = 384
allowColors = true
allowBack = false
maxDistance = 6.0

[administration.vanish]
preventItemPickup = true
preventItemDrop = false
hideJoinQuit = true

# ---------------------------------------------------------------------------
# Utility
# ---------------------------------------------------------------------------
[utility.kits]
enabled = true
maxKits = 128
maxItemsPerKit = 64
overflowPolicy = "REJECT"
# Equip delivered armor and offhand items into empty equipment slots.
autoEquip = true
# Hide one-time kits that the player has already claimed from /kits.
hideClaimedOnce = false

[utility.items]
repairEnabled = true
repairEnchanted = false
repairAllIncludesArmor = true
moreEnabled = false
condenseEnabled = false

[utility.itemEditing]
# Caps for /itemname and /itemlore. Longer input is rejected, not truncated.
maxItemNameLength = 64
maxLoreLines = 10
maxLoreLineLength = 80
# When false, /hat only accepts items with an equipment capability (for example armor).
allowAnyItemAsHat = false
# Seconds a /clearinventory confirmation code stays valid.
clearConfirmationSeconds = 15
# Whether /clearinventory requires a confirmation code until a player disables it with
# /clearinventoryconfirmtoggle.
confirmClear = true

[utility.give]
# Default and maximum /give and /item amount. Explicit amounts must be within 1..maxAmount.
defaultAmount = 1
maxAmount = 2304
# Registry ids refused by /give and /item (namespace optional).
blacklist = []
# Drop what does not fit at the target's feet instead of failing.
dropIfFull = false

[utility.powertools]
enabled = true
# Minimum seconds between two powertool firings per player.
throttleSeconds = 1

[utility.inspection]
# When true, /invsee is backed by the target's real inventory for viewers holding
# cellulosesz.invsee.edit; when false it stays read-only for everyone.
editable = true

[utility.workstations]
enabled = false
allowed = [
    "CRAFTING",
    "ANVIL",
    "GRINDSTONE",
    "STONECUTTER",
    "LOOM",
    "CARTOGRAPHY",
    "SMITHING",
]

# ---------------------------------------------------------------------------
# Players (presence, sessions, nicknames, player queries)
# ---------------------------------------------------------------------------
[players.afk]
enabled = true
autoAfterSeconds = 300
checkIntervalTicks = 20
movementThreshold = 0.15
rotationThresholdDegrees = 3.0
manualClearOnActivity = false
announceStateChanges = false
# Kick an AFK player after this many seconds; 0 disables the kick. AFK_BYPASS exempts.
kickAfterSeconds = 0
freezeWhileAfk = false
disableItemPickup = false
cancelOnInteract = false
cancelOnChat = false
cancelOnFish = false
sleepIgnoresAfk = false
listName = "[AFK]"

[players.sessions]
enabled = true
heartbeatIntervalSeconds = 60
maxRetryBufferSize = 1024

[players.nicknames]
enabled = true
minimumVisibleLength = 2
maximumVisibleLength = 24
allowSpaces = true
applyToVanillaDisplay = false
# Legacy & colour codes require this toggle AND the cellulosesz.nick.colors capability.
allowColors = false
# Optional full-match regex on the visible (code-stripped) nickname; "" disables it.
allowedPattern = ""
blacklist = []
prefix = ""
resetOnNameChange = false

[players.list]
# Optional permission groups shown by /list, in priority order. A player joins the first
# group whose permission they hold, otherwise the default group.
# [[players.list.groups]]
# id = "staff"
# permission = "cellulosesz.group.staff"
# label = "Staff"
groups = []

[players.list.defaultGroup]
id = "default"
permission = ""
label = "Default"

[players.nearby]
defaultRadius = 100
maximumRadius = 256
maximumResults = 20
hideSpectators = true

# ---------------------------------------------------------------------------
# Native economy. CellulosesZ is the only wallet owner; there is no Vault,
# Treasury or EconomyCraft integration. All amounts are quoted exact decimals
# with at most two fractional digits; a TOML float is rejected on the money path.
# ---------------------------------------------------------------------------
[economy]
# When false, all economy commands report that the feature is disabled and no new
# transaction is accepted. Existing tables and balances are never deleted.
enabled = false
# Display only; changes never rescale existing balances.
currency-name = "Coins"
currency-symbol = "$"
# Applied once, only when an account is first created. Does not re-credit a zero balance.
starting-balance = "0.00"
maximum-balance = "1000000000000.00"
minimum-payment = "0.01"
maximum-payment = "1000000.00"
allow-offline-payments = true
history-page-size = 10
balance-top-page-size = 10
show-zero-balances-in-top = false

# Player-to-player payment policy. Per-account toggles live in the shared preference store.
[economy.pay]
# Whether a player accepts payments until they change it with /paytoggle.
acceptByDefault = true
# Whether /pay requires repeating the identical command before it executes (see /payconfirmtoggle).
confirmByDefault = false
# Refuse payments to a player who ignores the payer. The ignore list is owned by the communication
# module; enabling this never reveals who ignores whom.
excludesIgnoreList = false

# Item buy-back catalogue. /worth reads it; /sell credits it through the ledger.
[economy.worth]
# Import cellulosesz/worth/default.tsv once, and only while cz_economy_worth is empty.
seedBundledDefaults = true

# Item buy-back policy. Each credit is still one balanced ledger transaction.
[economy.sell]
# When false, /sell inventory and /sell blocks also need cellulosesz.sell.bulk.
allowBulk = false
# When false, a stack carrying a custom name is never sold.
allowNamedItems = false
# Sell-price multipliers keyed by permission: the highest held factor wins; no match pays face value.
# [[economy.sell.multipliers]] permission = "cellulosesz.sell.multiplier.2" ; multiplier = "2.00"
multipliers = []

# ---------------------------------------------------------------------------
# Public API
# ---------------------------------------------------------------------------
# System-level capabilities trusted addons may request through the public API.
# Deny-by-default: an addon receives nothing until it is listed here.
[api]
enabled = false
# Per-addon grants, for example:
# [api.addons."example_quests"]
# allowedCapabilities = ["kit.grant", "mail.send.system", "economy.grant"]
# [api.addons."example_admin_bridge"]
# allowedCapabilities = ["moderation.mute", "moderation.unmute"]
# [api.addons."example_shop"]
# allowedCapabilities = ["economy.balance.read", "economy.pay.as-player", "economy.take"]
# --------------------------------------------------------------- economy capabilities:
# economy.balance.read, economy.ranking.read, economy.history.read, economy.pay.as-player,
# economy.grant, economy.take, economy.set. An economy write capability is powerful: grant it only
# to an addon you trust to move funds with a durable, idempotent requestKey.
# --------------------------------------------------------------- additional capabilities:
# player.preferences.read, player.preferences.write, economy.worth.read, economy.worth.write,
# movement.location.read. movement.worlds reads are ungated.

# ---------------------------------------------------------------------------
# Backup. The command is an argument vector and is executed directly, never through a shell.
# ---------------------------------------------------------------------------
[backup]
enabled = false
# Example: command = ["rdiff-backup", "world", "backups/world"]
command = []
# Periodic interval in minutes; 0 disables the schedule (manual /backup still works).
intervalMinutes = 30
alwaysRun = false
timeoutSeconds = 300
maxOutputChars = 2000
