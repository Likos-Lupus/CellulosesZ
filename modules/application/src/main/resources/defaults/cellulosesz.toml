# CellulosesZ configuration (TOML).
#
# This file is a packaged template. It is written once, on first start, and is never
# rewritten by the mod; edit it freely. Unknown keys are rejected, so a typo fails the load.

[diagnostics]
# When true, storage/permission/health diagnostics are logged more verbosely. Secrets are never logged.
verboseLogging = false

# ---------------------------------------------------------------------------
# Storage. Only the backend named by `type` is initialized. Every backend has its
# own section, so you can prepare an alternative backend and switch `type` later;
# switching the active backend migrates data on the next cold start.
# ---------------------------------------------------------------------------
[database]
# One of: sqlite, h2, mysql, mariadb, postgresql.
type = "sqlite"
# Logical namespace stored alongside all rows. Use distinct values to share one
# database/schema between several servers. Must match [a-z0-9_]{1,32}.
namespace = "default"

# Shared pool timeouts; backend sections may override selected values.
[database.pool]
maximum-pool-size = 10
connection-timeout-ms = 10000
validation-timeout-ms = 5000
idle-timeout-ms = 600000
max-lifetime-ms = 1800000
keepalive-time-ms = 0

[database.sqlite]
# Relative paths resolve under <world>/cellulosesz/.
path = "cellulosesz.db"
busy-timeout-ms = 5000
journal-mode = "wal"
synchronous = "normal"
foreign-keys = true

[database.sqlite.pool]
# A single writer connection is the safe SQLite default.
maximum-pool-size = 1

[database.h2]
path = "cellulosesz"
username = "sa"
# Set at most one of password / password-env.
password = ""
password-env = ""

[database.h2.pool]
maximum-pool-size = 2

[database.mysql]
host = "127.0.0.1"
port = 3306
database = "cellulosesz"
username = "cellulosesz"
# Set at most one of password / password-env. Prefer password-env so the secret is not on disk.
password = ""
password-env = ""
ssl-mode = "preferred"

[database.mysql.pool]
maximum-pool-size = 10

[database.mariadb]
host = "127.0.0.1"
port = 3306
database = "cellulosesz"
username = "cellulosesz"
password = ""
password-env = ""
ssl-mode = "preferred"

[database.mariadb.pool]
maximum-pool-size = 10

[database.postgresql]
host = "127.0.0.1"
port = 5432
database = "cellulosesz"
schema = "public"
username = "cellulosesz"
password = ""
password-env = ""
ssl-mode = "prefer"

[database.postgresql.pool]
maximum-pool-size = 10

# ---------------------------------------------------------------------------
# Localization and text. CellulosesZ renders its own messages server-side; this
# controls CellulosesZ-owned text only, not the player's Minecraft client language.
# ---------------------------------------------------------------------------
[localization]
# Default language for players without an explicit /cellulosesz language preference.
# Must be one of the bundled languages (en_us, zh_cn).
defaultLanguage = "en_us"

[text]
# Preset palette: default | high-contrast | minimal.
theme = "default"
# Layout density: comfortable | compact.
density = "comfortable"

# Optional colour overrides. Uncomment and edit individual tokens; the selected preset supplies any
# token you leave commented.
# [text.colors]
# body = "#E8EDF4"
# secondary = "#B8C4D2"
# muted = "#8D9DB1"
# brand = "#78AFFF"
# heading = "#F5C86B"
# value = "#F8DB98"
# action = "#85C9FF"
# success = "#86D7A0"
# warning = "#FFCF79"
# error = "#FF858B"
# code = "#C4B3F5"
# divider = "#71819A"

# ---------------------------------------------------------------------------
# Movement
# ---------------------------------------------------------------------------
[movement.teleport]
delaySeconds = 0
cooldownSeconds = 0
cancelOnMove = true
cancelOnDamage = true
movementTolerance = 0.15
dismountPassengers = true

[movement.teleport.safety]
enabled = true
searchHorizontalRadius = 3
searchVerticalRadius = 8
allowWater = false

[movement.requests]
timeoutSeconds = 60
maxIncomingPerPlayer = 5
maxOutgoingPerPlayer = 16
maxRequestsServerWide = 4096
maxBatchRecipients = 16
batchCooldownSeconds = 120
maxAutoAllowedPlayers = 128

[movement.homes]
maxPerPlayer = 10
defaultName = "home"

[movement.history]
enabled = true

[movement.randomTeleport]
enabled = true
maxAttempts = 16
maxRadius = 10000
maxRegions = 32
searchTimeoutSeconds = 20
cooldownSeconds = 120
maxConcurrentServerSearches = 2
maxConcurrentPerPlayer = 1
allowChunkGeneration = false
allowWater = false

[movement.terrain]
enabled = true
maxJumpDistance = 32
requireLoadedChunks = true
allowWater = false

# ---------------------------------------------------------------------------
# Communication
# ---------------------------------------------------------------------------
[messaging]
enabled = true

[messaging.privateMessages]
enabled = true
maxMessageLength = 512
maxIgnoredPlayers = 128
defaultReplyMode = "LAST_INTERACTION"

[messaging.mail]
enabled = true
maxMessageLength = 1000
maxMessagesPerMailbox = 100
maxSendsPerMinute = 10
notifyOnJoin = true

[messaging.helpOp]
enabled = true
maxMessageLength = 512
maxMessagesPerMinute = 6

[messaging.announcements]
enabled = true
maxMessageLength = 1000

# Server info pages: /motd, /rules, /info and /customtext <page>. Markdown files live under
# <config-dir>/cellulosesz/<rootDirectory>/<lang>/<page>.md (en_us is the fallback language).
[messaging.serverPages]
enabled = true
rootDirectory = "pages"
maxPageBytes = 65536
maxPages = 128
showMotdOnJoin = false

# /me action messages. `audience` is `same_dimension` or `server`. When `overrideVanillaMe` is true
# the vanilla /me executor is replaced; /czme is always available as a fallback.
[messaging.actionMessage]
enabled = true
overrideVanillaMe = true
audience = "same_dimension"
maximumLength = 256
messagesPerMinute = 8

# ---------------------------------------------------------------------------
# Administration
# ---------------------------------------------------------------------------
[administration.moderation]
enabled = true
protectOperators = true
defaultKickReason = "Kicked by an administrator"
defaultBanReason = "Banned by an administrator"
defaultMuteReason = "Muted by an administrator"
maxReasonLength = 256
notifyModerators = true
auditEnabled = true

[administration.jail]
enabled = true
defaultJail = ""
maxJails = 32
allowedRadius = 8.0
returnOnRelease = true
confinementCheckIntervalTicks = 20
restrictCommands = false

[administration.playerAdjustments]
# Upper bound for a single /exp give|take|set amount; larger values are clamped.
maximumExperienceAdjustment = 1000000
# Allowed /speed multiplier range (walk and fly). Values outside are clamped.
minimumSpeedMultiplier = 0.1
maximumSpeedMultiplier = 3.0

# ---------------------------------------------------------------------------
# Utility
# ---------------------------------------------------------------------------
[utility.kits]
enabled = true
maxKits = 128
maxItemsPerKit = 64
overflowPolicy = "REJECT"

[utility.items]
repairEnabled = true
repairEnchanted = false
repairAllIncludesArmor = true
moreEnabled = false
condenseEnabled = false

[utility.itemEditing]
# Caps for /itemname and /itemlore. Longer input is rejected, not truncated.
maxItemNameLength = 64
maxLoreLines = 10
maxLoreLineLength = 80
# When false, /hat only accepts items with an equipment capability (for example armor).
allowAnyItemAsHat = false
# Seconds a /clearinventory confirmation code stays valid.
clearConfirmationSeconds = 15

[utility.workstations]
enabled = false
allowed = [
    "CRAFTING",
    "ANVIL",
    "GRINDSTONE",
    "STONECUTTER",
    "LOOM",
    "CARTOGRAPHY",
    "SMITHING",
]

# ---------------------------------------------------------------------------
# Players (presence, sessions, nicknames, player queries)
# ---------------------------------------------------------------------------
[players.afk]
enabled = true
autoAfterSeconds = 300
checkIntervalTicks = 20
movementThreshold = 0.15
rotationThresholdDegrees = 3.0
manualClearOnActivity = false
announceStateChanges = false

[players.sessions]
enabled = true
heartbeatIntervalSeconds = 60
maxRetryBufferSize = 1024

[players.nicknames]
enabled = true
minimumVisibleLength = 2
maximumVisibleLength = 24
allowSpaces = true
applyToVanillaDisplay = false

[players.nearby]
defaultRadius = 100
maximumRadius = 256
maximumResults = 20
hideSpectators = true
