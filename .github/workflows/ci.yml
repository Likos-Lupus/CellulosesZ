name: CellulosesZ CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "25" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Print Toolchain Info
        run: |
          java -version
          ./gradlew --version

      - name: Architecture, module checks, build, artifact inspection
        run: ./gradlew --no-daemon verifyArchitecture checkModuleDependencies checkModules chiseledBuild inspectArtifacts --stacktrace

      - name: Inspect Fabric artifact metadata
        run: |
          set -euo pipefail
          FABRIC_JAR=$(ls versions/26.1.2-fabric/build/libs/*-fabric.jar)
          echo "Inspecting $FABRIC_JAR"
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -q "fabric-language-kotlin"
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -q "top.likoslupus.cellulosesz.fabric.CellulosesZFabric"
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -qF '"environment"'
          unzip -p "$FABRIC_JAR" fabric.mod.json | grep -qF '"*"'
          for jar in HikariCP tomlkt adventure-platform-fabric; do
            unzip -l "$FABRIC_JAR" | grep -q "META-INF/jars/$jar" || { echo "missing nested runtime jar: $jar"; exit 1; }
          done
          for driver in sqlite-jdbc- h2- postgresql- mariadb-java-client- mysql-connector-j-; do
            if unzip -l "$FABRIC_JAR" | grep -q "META-INF/jars/$driver"; then
              echo "JDBC drivers are provisioned at runtime and must not be bundled: $driver"; exit 1
            fi
          done

      - name: Inspect NeoForge artifact Kotlin runtime (Jar-in-Jar)
        run: |
          set -euo pipefail
          NEOFORGE_JAR=$(ls versions/26.1.2-neoforge/build/libs/*-neoforge.jar)
          echo "Inspecting $NEOFORGE_JAR"
          unzip -p "$NEOFORGE_JAR" META-INF/neoforge.mods.toml | grep -q 'modLoader = "javafml"'
          for module in kotlin-stdlib kotlinx-coroutines-core-jvm kotlinx-serialization-core-jvm kotlinx-serialization-json-jvm HikariCP tomlkt adventure-platform-neoforge; do
            unzip -l "$NEOFORGE_JAR" | grep -q "META-INF/jars/$module" \
              || { echo "missing Jar-in-Jar: $module"; exit 1; }
          done
          for driver in sqlite-jdbc- h2- postgresql- mariadb-java-client- mysql-connector-j-; do
            if unzip -l "$NEOFORGE_JAR" | grep -q "META-INF/jars/$driver"; then
              echo "JDBC drivers are provisioned at runtime and must not be bundled: $driver"; exit 1
            fi
          done

      - name: Package offline JDBC driver bundle
        run: ./gradlew --no-daemon packageDriverBundle --stacktrace

      - name: Upload offline JDBC driver bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellulosesZ-drivers
          path: build/driver-bundle/*.zip

      - name: Upload test reports (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellulosesZ-test-reports
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**

      - name: Upload built jars (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellulosesZ-artifacts
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar

  compatibility-smoke:
    name: Compatibility smoke (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Structural compatibility smoke (both loaders)
        run: ./gradlew --no-daemon chiseledBuild compatSmokeBothLoaders --stacktrace

      - name: Upload compatibility reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellulosesZ-compatibility
          path: build/reports/compatibility/**
