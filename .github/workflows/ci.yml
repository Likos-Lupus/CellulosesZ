name: CellulosesZ CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ "25" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build (includes tests & checks)
        run: ./gradlew --no-daemon build --stacktrace

      - name: Upload test reports (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellulosesZ-test-reports
          path: |
            **/build/test-results/test/**
            **/build/reports/tests/test/**

      - name: Upload built jars (if any)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: CellulosesZ-artifacts
          path: |
            **/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
