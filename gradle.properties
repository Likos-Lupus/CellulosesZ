# Gradle settings
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.daemon=false

# Mod identity (not a dependency version; see gradle/libs.versions.toml for all versions)
mod_group=top.likoslupus
mod_id=cellulosesz
mod_name=CellulosesZ
mod_license=GPL-3.0

# Plugins applied from settings.gradle.kts cannot read the version catalog, so these build-tool
# versions stay here and are hoisted into the settings `plugins {}` block. Hoisting guarantees the
# whole build shares a single plugin classloader; applying Loom/Architectury per-subproject causes
# ClassCastException on the Loom extension in this Stonecutter multi-project layout.
# Every other version still lives exclusively in gradle/libs.versions.toml.
stonecutter_version=0.9.8
kotlin_version=2.4.20
architectury_loom_version=1.17.491
architectury_plugin_version=3.5.170
